name: Build and update GitOps with ECR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: "Deploy action"
        required: true
        type: choice
        options:
          - deploy
          - rollback
      rollback_tag:
        description: "Rollback image tag"
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "306667525254"
  ECR_REPOSITORY: devship-demo-backend
  GITOPS_REPO: MiguelSilva04/devship-gitops

jobs:
  build-and-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Validate rollback tag
        if: ${{ inputs.action == 'rollback' && inputs.rollback_tag == '' }}
        run: |
          echo "rollback_tag is required when action is rollback"
          exit 1

      - name: Define image tag
        run: |
          if [ "${{ inputs.action }}" = "rollback" ]; then
            echo "IMAGE_TAG=${{ inputs.rollback_tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG ./app

      - name: Tag Docker image for ECR
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker image to ECR
        if: ${{ inputs.action == 'deploy' }}
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in GitOps manifest
        run: |
          GITOPS_PATH="apps/demo-app/${{ inputs.environment }}/backend-deployment.yaml"
          ECR_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          sed -i "s|^\( *image: \).*|\1$ECR_IMAGE|" gitops/$GITOPS_PATH

          echo "GITOPS_PATH=$GITOPS_PATH" >> $GITHUB_ENV
          echo "ECR_IMAGE=$ECR_IMAGE" >> $GITHUB_ENV

      - name: Commit and push GitOps change
        run: |
          cd gitops
          git config user.name "devship-github-actions"
          git config user.email "devship-actions@users.noreply.github.com"
          git add $GITOPS_PATH
          git commit -m "chore: ${{ inputs.action }} $ECR_IMAGE to ${{ inputs.environment }}" || echo "No changes to commit"
          git push
